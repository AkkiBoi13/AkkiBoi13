name: Update live section

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/update.py]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runs queue behind each other; start from the newest main, not the commit that triggered this run.
      - run: git pull --ff-only origin main
      - run: python tools/update.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update live section"
          git push
